name: Build AutoSleep

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
      - name: Install dependencies
        run: brew install ldid perl
      - name: Build package
        run: make THEOS=$HOME/theos THEOS_PACKAGE_SCHEME=roothide TARGET_CODESIGN=true package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: AutoSleep-rootless
          path: packages/*.deb


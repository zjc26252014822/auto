name: Build AutoSleep

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: theos/setup-theos@v1
      - run: make package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: AutoSleep-rootless
          path: packages/*.deb
